name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex.: v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DrivePlayWindows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DrivePlayWindows/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Baixar ffmpeg
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh

      - name: Gerar instalador e portátil
        run: npm run dist:win

      - name: Gerar pasta portátil
        run: npm run pack:win

      - name: Compactar pasta portátil
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType File -Path "dist/DrivePlay-win32-x64/portable.txt" -Force | Out-Null
          Compress-Archive -Path "dist/DrivePlay-win32-x64" -DestinationPath "dist/DrivePlay-$version-win32-x64-portable.zip" -Force

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            DrivePlayWindows/dist/*.exe
            DrivePlayWindows/dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: DrivePlayWindows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DrivePlayWindows/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Baixar ffmpeg
        run: |
          chmod +x scripts/fetch-ffmpeg.sh
          ./scripts/fetch-ffmpeg.sh

      - name: Gerar app universal
        run: npm run dist:mac

      - name: Assinar e compactar
        run: |
          VERSION=$(node -p "require('./package.json').version")
          codesign --force --deep --sign - dist/mac-universal/DrivePlay.app
          rm -f "dist/DrivePlay-macOS-universal-$VERSION.zip.blockmap"
          ditto -c -k --keepParent dist/mac-universal/DrivePlay.app "dist/DrivePlay-macOS-universal-$VERSION.zip"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: DrivePlayWindows/dist/DrivePlay-macOS-universal-*.zip
          if-no-files-found: error

  release:
    name: Publicar release
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DrivePlay ${{ github.event.inputs.tag || github.ref_name }}
          files: release/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
