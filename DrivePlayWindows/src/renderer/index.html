<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrivePlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </div>
        <div class="logo-text">
          <div class="logo-title">DrivePlay</div>
          <div class="logo-sub">MKV do Drive</div>
        </div>
      </div>

      <div class="link-field" id="link-field">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l2.12-2.12a5 5 0 0 0-7.07-7.07L11 4.93"/><path d="M14 11a5 5 0 0 0-7.07 0L4.81 13.12a5 5 0 0 0 7.07 7.07L13 19.07"/></svg>
        </span>
        <input id="link-input" type="text" placeholder="Cole o link de uma pasta ou de um vídeo do Drive…" autocomplete="off" spellcheck="false">
        <button id="clear-link" class="clear-btn hidden" type="button" title="Limpar link">×</button>
      </div>

      <button id="open-link" class="primary-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <span>Abrir</span>
      </button>

      <button id="toggle-sidebar" class="icon-btn hidden" type="button" title="Mostrar ou ocultar a lista de reprodução">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>

      <button id="library-toggle" class="library-btn" type="button" title="Biblioteca (Ctrl+B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Biblioteca</span>
      </button>

      <button id="recents-btn" class="icon-btn" type="button" title="Recentes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>

      <button id="help-btn" class="icon-btn" type="button" title="Como usar (F1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/></svg>
      </button>
    </header>

    <div id="main">
      <aside id="sidebar"></aside>
      <section id="content">
        <div id="player-shell" class="hidden">
          <div id="player-host"></div>
          <div id="player-overlay">
            <div id="skip-buttons" class="skip-buttons hidden">
              <button id="skip-ending" class="skip-btn hidden" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l9 8-9 8z" fill="currentColor"/><path d="M19 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Pular encerramento</span>
              </button>
              <button id="skip-intro" class="skip-btn hidden" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l9 8-9 8z" fill="currentColor"/><path d="M19 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Pular abertura</span>
              </button>
            </div>
          </div>
          <div id="loading-overlay" class="player-cover hidden">
            <div class="spinner"></div>
            <div class="cover-text">Carregando do Google Drive…</div>
          </div>
          <div id="error-overlay" class="player-cover hidden">
            <div class="error-panel">
              <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 9v5M12 17h.01"/></svg>
              </div>
              <div class="error-title">Não foi possível carregar o vídeo</div>
              <div class="error-text" id="error-text"></div>
              <div class="error-actions">
                <button id="error-retry" class="secondary-btn" type="button">Tentar novamente</button>
                <button id="error-vlc" class="secondary-btn" type="button">Abrir no VLC</button>
                <button id="error-download" class="secondary-btn" type="button">Baixar arquivo</button>
              </div>
            </div>
          </div>
        </div>
        <div id="idle"></div>
      </section>
    </div>

    <footer id="footer" class="hidden"></footer>
  </div>

  <div id="toast-root"></div>
  <div id="menu-root"></div>
  <div id="popover-root"></div>
  <div id="modal-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
